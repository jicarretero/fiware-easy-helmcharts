postgres:
  enabled: true
  port: 5432
  host_auth_method: trust
  image: postgres/postgresdb-postgis:latest-pg12
  service_name: postgres
  password: orion
  persistence:
    enabled: true
    storageClassName: crc-csi-hostpath-provisioner
    storage: "1Gi"
  volume:
    name: postgres-volume
    isHostPath: false
    isVolumeClaim: false
    mountPath: /var/lib/postgresql

    # Host path - used in case we are using Host path as volume
    hostPath: /tmp/postgres-data

    # persistentVolume - in case we set isVolumeClaim to True
    claimName: postgres-data-pvc

    # The next are ready to be deployed
    selectNode: false
    node: k8s-node-03
